name: Monorepo CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sorolink-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sorolink-backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sorolink-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sorolink-frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:prod
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.node-version || 'default' }}
          path: sorolink-frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  frontend-a11y:
    name: Frontend accessibility lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sorolink-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated a11y lint toolchain
        run: npm install --prefix tools/a11y-lint --no-package-lock --no-audit --no-fund
      - name: Fail on jsx-a11y violations
        run: npm run lint:a11y

  cli:
    name: CLI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: sorolink-backend
        run: npm ci
      - name: Install CLI dependencies
        working-directory: sorolink-cli
        run: npm ci
      - name: Typecheck CLI
        working-directory: sorolink-cli
        run: npm run typecheck
      - name: Test CLI
        working-directory: sorolink-cli
        run: npm run test
      - name: Build CLI
        working-directory: sorolink-cli
        run: npm run build

