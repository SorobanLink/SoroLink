version: 2

updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    assignees:
      - "sorolink-maintainers"
    groups:
      github-actions:
        patterns:
          - "*"

  # sorolink-backend npm dependencies
  - package-ecosystem: "npm"
    directory: "/sorolink-backend"
    schedule:
      interval: "weekly"
      day: "monday"
    assignees:
      - "sorolink-maintainers"
    groups:
      backend-non-security:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # sorolink-frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/sorolink-frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    assignees:
      - "sorolink-maintainers"
    groups:
      frontend-non-security:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # sorolink-cli npm dependencies
  - package-ecosystem: "npm"
    directory: "/sorolink-cli"
    schedule:
      interval: "weekly"
      day: "monday"
    assignees:
      - "sorolink-maintainers"
    groups:
      cli-non-security:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
